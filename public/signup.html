<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
    <title>Partner Sign Up - Coffee Clover</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="signup-page">
    <div class="signup-wrapper">
        <div class="signup-left">
            <img src="../assets/signup-coffee.avif" alt="Coffee beans and plants background" />
            <div class="signup-overlay">
                <h1 class="brand-title">Aniya</h1>
                <p>Find your favorite coffee blend with us.</p>
            </div>
        </div>
        <div class="signup-right">
            <div class="form-box">
                <h2>Create your account</h2>
                <p>Please sign up to get started</p>
                <form id="signupForm" method="POST" action="signup.php">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required />
                    
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required />
                    
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required />
                    
                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                <p class="login-link">Already have an account? <a href="login.html">Log In</a></p>
                <p class="partnership-link" style="margin-top: 20px;">After signing up, please <a href="aniya_registration_form.html">fill out the partnership form</a> to connect with us.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
