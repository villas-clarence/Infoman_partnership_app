<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Partner Dashboard - Coffee Clover</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="partnership.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="partnership.js" defer></script>
</head>
<body>

<header>
  <h1>🌿 Aniya's Partner Dashboard</h1>
  <div class="nav-links">
    <button onclick="logout()">Log Out</button>
  </div>
</header>

<div class="dashboard-grid">
  <!-- ID Card Panel -->
  <div class="card id-card">
    <h2>📋 My ID Card</h2>
    <p><strong>Name:</strong> <span id="treePartnerName">Tree Partner</span></p>
    <p><strong>Date of Birth:</strong> 04/16/2025</p>
    <p><strong>Tree Type:</strong> Coffee Tree</p>
    <div class="map-container">
      <img src="../assets/partneship_image.jpeg" alt="Coffee Tree Location" />
      <p><strong>Location:</strong> Sitio Dueg, Tarlac, Philippines</p>
    </div>
  </div>

  <!-- Countdown, Updates, and Partnership Interaction Panel -->
  <div class="card enhanced-border">
    <h2>🌱 Coffee Beans Readiness</h2>
    <div class="countdown" id="countdown"></div>

    <h3 style="margin-top: 2rem;">📸 Latest Updates from the Farm</h3>
    <canvas id="farmUpdatesChart" style="max-height: 300px;"></canvas>

    <h3 style="margin-top: 2rem;">🌳 Manage Your Tree Name</h3>
    <input type="text" id="partnerName" placeholder="Enter your tree name...">
    <button onclick="submitPartner()">Add</button>
    <canvas id="treeNameChart" style="max-height: 300px; margin-top: 1.5rem;"></canvas>
  </div>
</div>

<footer>
  © 2025 Aniya | Empowering Sustainable Farming
</footer>

</body>
</html>
