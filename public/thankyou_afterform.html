<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Aniya Registration</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .thank-you-container {
      background: #ffffff;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #2e8b57;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #2e8b57;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.3s ease;
    }
    a:hover {
      background-color: #256d45;
    }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <h1>🎉 Thank You!</h1>
    <p>Your registration with Aniya has been successfully submitted. We appreciate your commitment to sustainable farming.</p>
    <a href="index.html">Return to Home</a>
  </div>
</body>
</html>
