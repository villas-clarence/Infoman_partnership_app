<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aniya Registration Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f5f9;
      padding: 2rem;
    }
    form {
      background: #fff;
      max-width: 700px;
      margin: auto;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2e8b57;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    input[type="file"] {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    fieldset {
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
    }
    legend {
      font-weight: bold;
      padding: 0 0.5rem;
    }
    .total {
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 1rem;
      color: #2e8b57;
    }
    button[type="submit"] {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background-color: #2e8b57;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      margin-top: 2rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button[type="submit"]:hover {
      background-color: #256d45;
    }
    .checkbox-group, .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0.5rem 0;
    }
    .checkbox-group input[type="checkbox"],
    .radio-group input[type="radio"] {
      margin-right: 0.5rem;
      cursor: pointer;
    }
    .checkbox-group label,
    .radio-group label {
      cursor: pointer;
      font-weight: 400;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <form action="reg_submit.php" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="registrant_id" id="registrant_id" />
    <h2>Aniya Registration</h2>

    <label>Full Name <input type="text" name="fullName" id="fullName" required></label>
    <label>Email Address <input type="email" name="email" id="email" required></label>
    <label>Mobile Number <input type="text" name="mobile" id="mobile" required></label>
    <label>Company Name <input type="text" name="company" id="company"></label>
    <label>Role <input type="text" name="role" id="role"></label>
    <label>Preferred Contact Method
      <select name="contactMethod" id="contactMethod" required>
        <option value="SMS">SMS</option>
        <option value="Email">Email</option>
        <option value="Both">Both</option>
      </select>
    </label>

    <label>Package Type
      <select name="package" required>
        <option value="Grower Package">Grower Package</option>
        <option value="Legacy Package">Legacy Package</option>
      </select>
    </label>
    <label>How many trees would you like to plant?
      <input type="number" name="treeCount" id="treeCount" min="10" required>
    </label>

    <p class="total">Total Cost: <span id="totalAmount">P0</span></p>
    <input type="hidden" name="totalAmount" id="totalAmountInput">

    <fieldset>
      <legend>Intercropping Options</legend>
      <div class="radio-group">
        <label><input type="radio" name="intercropping" value="Yes"> Yes</label>
        <label><input type="radio" name="intercropping" value="No"> No</label>
      </div>

      <label><strong>Crops</strong></label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="crops[]" value="Papaya"> Papaya</label>
        <label><input type="checkbox" name="crops[]" value="Saging"> Saging</label>
        <label><input type="checkbox" name="crops[]" value="Kamoteng Kahoy"> Kamoteng Kahoy</label>
        <label><input type="checkbox" name="crops[]" value="Sili"> Sili</label>
        <label><input type="checkbox" name="crops[]" value="Pineapple"> Pineapple</label>
      </div>

      <label><strong>Livestock</strong></label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="livestock[]" value="Pigs"> Pigs</label>
        <label><input type="checkbox" name="livestock[]" value="Goats"> Goats</label>
        <label><input type="checkbox" name="livestock[]" value="Chickens"> Chickens</label>
      </div>
    </fieldset>

    <label>Name on Tree Certificate <input type="text" name="certificateName" id="certificateName"></label>

    <fieldset>
      <legend>Dashboard Setup</legend>
      <div class="radio-group">
        <label><input type="radio" name="dashboard" value="Yes"> Yes</label>
        <label><input type="radio" name="dashboard" value="No"> No</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Gift Option</legend>
      <div class="radio-group">
        <label><input type="radio" name="gift" value="Yes"> Yes</label>
        <label><input type="radio" name="gift" value="No"> No</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notification Preference</legend>
      <div class="checkbox-group">
        <label><input type="checkbox" name="notification[]" value="email"> Email</label>
        <label><input type="checkbox" name="notification[]" value="sms"> SMS</label>
        <label><input type="checkbox" name="notification[]" value="none"> None</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Payment Method</legend>
      <div class="radio-group">
        <label><input type="radio" name="paymentMethod" value="GCash"> GCash</label>
        <label><input type="radio" name="paymentMethod" value="Bank Transfer"> Bank Transfer</label>
      </div>
    </fieldset>

    <label>Upload Proof of Payment
      <input type="file" name="paymentProof" accept="image/*">
    </label>

    <fieldset>
      <legend>Zoom Call with CEO</legend>
      <div class="radio-group">
        <label><input type="radio" name="zoomCall" value="Yes"> Yes</label>
        <label><input type="radio" name="zoomCall" value="No"> No</label>
      </div>
    </fieldset>

    <label>
      <input type="checkbox" name="agreement" required>
      I agree to Aniya's terms and confirm all details are correct.
    </label>

    <button type="submit">Submit</button>
  </form>

  <script>
    // Total Cost Calculator
    const treeCountInput = document.getElementById("treeCount");
    const totalDisplay = document.getElementById("totalAmount");
    const totalInput = document.getElementById("totalAmountInput");

    function updateTotal() {
      const count = parseInt(treeCountInput.value) || 0;
      const total = count * 100; // example: 100 per tree
      totalDisplay.textContent = "P" + total;
      totalInput.value = total;
    }
    treeCountInput.addEventListener("input", updateTotal);

    // Load edit data if present
    const registrant = JSON.parse(localStorage.getItem('editRegistrant') || '{}');
    if (registrant.registrant_id) {
      document.getElementById('registrant_id').value = registrant.registrant_id;
      document.getElementById('fullName').value = registrant.full_name || '';
      document.getElementById('email').value = registrant.email || '';
      document.getElementById('mobile').value = registrant.mobile || '';
      document.getElementById('company').value = registrant.company || '';
      document.getElementById('role').value = registrant.role || '';
      document.getElementById('contactMethod').value = registrant.contact_method || '';
    }
  </script>
</body>
</html>
