<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aniya Registration Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 50%, #e0f2e0 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      color: #2d5a3d;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(45, 90, 61, 0.1);
    }

    .header p {
      color: #4a7c59;
      font-size: 1.1rem;
      font-weight: 400;
    }

    form {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(45, 90, 61, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(45, 90, 61, 0.1);
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .section-title {
      color: #2d5a3d;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #a8d5a8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #4CAF50, #66BB6A);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.8rem;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 1.5rem;
      color: #2d5a3d;
      font-weight: 500;
      font-size: 1rem;
    }

    .label-text {
      margin-bottom: 0.5rem;
      display: block;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    input[type="file"] {
      width: 100%;
      padding: 1rem;
      border: 2px solid #c8e6c9;
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
      background: white;
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%234CAF50' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 1rem center;
      background-repeat: no-repeat;
      background-size: 1rem;
      padding-right: 3rem;
    }

    fieldset {
      border: 2px solid #c8e6c9;
      padding: 1.5rem;
      border-radius: 15px;
      margin-bottom: 1.5rem;
      background: rgba(232, 245, 232, 0.3);
    }

    legend {
      font-weight: 600;
      padding: 0 1rem;
      color: #2d5a3d;
      font-size: 1.1rem;
    }

    .checkbox-group, .radio-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 0.5rem 0;
    }

    .checkbox-group label,
    .radio-group label {
      cursor: pointer;
      font-weight: 400;
      display: flex;
      align-items: center;
      padding: 0.8rem 1rem;
      border: 2px solid #e8f5e8;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.7);
      margin: 0;
    }

    input[type="file"] {
      padding: 1rem;
      border: 2px dashed #c8e6c9;
      border-radius: 12px;
      background: rgba(232, 245, 232, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .total {
      background: linear-gradient(135deg, #4CAF50, #66BB6A);
      color: white;
      padding: 1.2rem 1.5rem;
      border-radius: 15px;
      font-weight: 600;
      font-size: 1.3rem;
      text-align: center;
      margin: 1.5rem 0;
    }

    .agreement-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.5rem;
      background: rgba(232, 245, 232, 0.3);
      border: 2px solid #c8e6c9;
      border-radius: 15px;
      margin: 2rem 0;
    }

    button[type="submit"] {
      width: 100%;
      padding: 1.2rem 2rem;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .required {
      color: #e57373;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .checkbox-group, .radio-group {
        grid-template-columns: 1fr;
      }
    }
  

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌱 Aniya Registration</h1>
      <p>Join us in creating a sustainable future through tree planting</p>
    </div>

    <form action="reg_submit.php" method="POST" enctype="multipart/form-data">
      <!-- PERSONAL INFO -->
      <div class="form-section">
        <div class="section-title">
          <div class="section-icon">👤</div>
          Personal Information
        </div>

        <label>
          <span class="label-text">Full Name <span class="required">*</span></span>
          <input type="text" name="full_name" required placeholder="Enter your full name">
        </label>


        <label>
          <span class="label-text">Mobile Number <span class="required">*</span></span>
          <input type="text" name="mobile" required placeholder="+63 900 000 0000">
        </label>

        <label>
          <span class="label-text">Company Name</span>
          <input type="text" name="company_name" placeholder="Your company (optional)">
        </label>

        <label>
          <span class="label-text">Role</span>
          <input type="text" name="role" placeholder="Your role/position (optional)">
        </label>

        <label>
          <span class="label-text">Preferred Contact Method <span class="required">*</span></span>
          <select name="contact_method" required>
            <option value="">Select contact method</option>
            <option value="SMS">SMS</option>
            <option value="Email">Email</option>
            <option value="Both">Both</option>
          </select>
        </label>
      </div>

      <!-- PACKAGE -->
      <div class="form-section">
        <div class="section-title">
          <div class="section-icon">📦</div>
          Package Selection
        </div>

        <label>
          <span class="label-text">Package Type <span class="required">*</span></span>
          <select name="package_type" id="packageTypeSelect" required>
            <option value="">Select package type</option>
            <option value="Grower">Grower Package</option>
            <option value="Legacy">Legacy Package</option>
          </select>
        </label>

        <label>
          <span class="label-text">How many trees would you like to plant? <span class="required">*</span></span>
          <input type="number" name="tree_count" id="treeCount" min="10" required placeholder="Minimum 10 trees">
        </label>

        <div class="total">
          Total Cost: <span id="totalAmount">₱0</span>
        </div>
        <input type="hidden" name="total_amount" id="totalAmountInput">
      </div>

      <!-- CERTIFICATE AND OPTIONS -->
      <div class="form-section">
        <label>
          <span class="label-text">Name on Tree Certificate</span>
          <input type="text" name="certificate_name" placeholder="Name to appear on certificate (optional)">
        </label>

        <fieldset>
          <legend>📊 Dashboard Setup</legend>
          <div class="radio-group">
            <label><input type="radio" name="dashboard_pref" value="Yes"> Yes</label>
            <label><input type="radio" name="dashboard_pref" value="No"> No</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>🏱 Gift Option</legend>
          <div class="radio-group">
            <label><input type="radio" name="gift_pref" value="Yes"> Yes</label>
            <label><input type="radio" name="gift_pref" value="No"> No</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>🔔 Notification Preferences</legend>
          <div class="checkbox-group">
            <label><input type="checkbox" name="notification_pref[]" value="email"> Email</label>
            <label><input type="checkbox" name="notification_pref[]" value="sms"> SMS</label>
            <label><input type="checkbox" name="notification_pref[]" value="none"> None</label>
          </div>
        </fieldset>
      </div>

      <!-- PAYMENT -->
      <div class="form-section">
        <div class="section-title"><div class="section-icon">💳</div>Payment Information</div>

        <fieldset>
          <legend>Payment Method</legend>
          <div class="radio-group">
            <label><input type="radio" name="payment_method" value="GCash"> GCash</label>
            <label><input type="radio" name="payment_method" value="Bank Transfer"> Bank Transfer</label>
          </div>
        </fieldset>

        <label>
          <span class="label-text">Upload Proof of Payment</span>
          <input type="file" name="payment_proof" accept="image/*">
        </label>
      </div>

      <!-- ZOOM -->
      <fieldset>
        <legend>📹 Zoom Call with CEO</legend>
        <div class="radio-group">
          <label><input type="radio" name="zoom_call" value="Yes"> Yes</label>
          <label><input type="radio" name="zoom_call" value="No"> No</label>
        </div>
      </fieldset>

      <!-- AGREEMENT -->
      <div class="agreement-checkbox">
        <input type="checkbox" name="agreement" id="agreement" required>
        <label for="agreement">I agree to Aniya’s terms and confirm the information is correct.</label>
      </div>

      <button type="submit">🌱 Complete Registration</button>
    </form>
  </div>

  <script>
    const packageSelect = document.querySelector('select[name="package_type"]');
    const treeCountInput = document.getElementById('treeCount');
    const totalAmountSpan = document.getElementById('totalAmount');
    const totalAmountInput = document.getElementById('totalAmountInput');

    const packagePrices = {
      "Grower": 319,
      "Legacy": 407
    };

    function updateTotalCost() {
      const selectedPackage = packageSelect.value;
      const treeCount = parseInt(treeCountInput.value) || 0;
      const pricePerTree = packagePrices[selectedPackage] || 0;
      const totalCost = pricePerTree * treeCount;
      totalAmountSpan.textContent = `₱${totalCost.toLocaleString()}`;
      totalAmountInput.value = totalCost;
    }

    packageSelect.addEventListener('change', updateTotalCost);
    treeCountInput.addEventListener('input', updateTotalCost);
    updateTotalCost();
  </script>
</body>
</html>
